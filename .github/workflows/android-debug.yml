name: Build Zual Hardware Android APK
on:
  push:
    branches: [android/v2-qa-search-reports-recovery]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-zual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # These are the existing PUBLIC/ANON FRONTEND credentials embedded in the app.
      # Never use the Supabase service_role or secret key in an Android bundle.
      VITE_SUPABASE_URL: "https://exajrwxoijmgljcvigyj.supabase.co"
      VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4YWpyd3hvaWptZ2xqY3ZpZ3lqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjg1OTksImV4cCI6MjA5NTkwNDU5OX0.l13EJNVBGvJrlFsS69hLX_wOAajxfBlF8mJ9ks1ATw0"
    steps:
      - name: Checkout correct source
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Python for branded Android icon
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Install existing app
        run: npm ci
      - name: Type-check all business modules
        run: npm run lint
      - name: Install Capacitor native build toolchain
        run: npm install --no-save --package-lock=false @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
      - name: Build locally bundled application resources
        run: npm run build
      - name: Generate native Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Brand launcher icon, status bar and keyboard
        run: |
          python -m pip install --quiet Pillow
          python scripts/brand_android.py
          test -s android/app/src/main/assets/public/index.html
          echo "Capacitor Android project contains locally bundled assets."
      - name: Set version and compatibility metadata
        run: |
          sed -i 's/versionCode 1/versionCode 3/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.1"/' android/app/build.gradle
          grep -n 'applicationId\|versionCode\|versionName\|minSdk' android/app/build.gradle
      - name: Compile installable Android APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify APK is signed and nonempty
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          echo "APK size: $(du -h "$APK" | cut -f1)"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -E '^(package:|sdkVersion:|targetSdkVersion:)' > android-apk-details.txt
          cat android-apk-details.txt
          grep -q "name='in.zualhardware.mobileqa'" android-apk-details.txt
          echo "APK signed and install package verified."
      - name: Upload APK for installation
        uses: actions/upload-artifact@v4
        with:
          name: Zual-Hardware-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
