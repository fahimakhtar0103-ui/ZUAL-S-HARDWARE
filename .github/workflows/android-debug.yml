name: Build Android debug APK
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ secrets.ZUAL_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.ZUAL_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check backend configuration
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Add ZUAL_SUPABASE_URL and ZUAL_SUPABASE_ANON_KEY as GitHub Actions repository secrets before building."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      - name: Install Capacitor Android tooling (CI only)
        run: npm install --no-save --package-lock=false @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
      - name: Build bundled web application
        run: npm run build
      - name: Generate native Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build installable Android debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: zual-hardware-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
