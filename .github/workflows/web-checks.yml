name: Web quality checks
on:
  push:
    branches: [fix/android-date-ui-safe, design/zual-premium-os, android/zual-install-reliability-v2, android/v2-qa-search-reports-recovery]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
